<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firefighter Roster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <h1 class="headline">Firefighter Roster</h1>
    <div class="avatar">👤</div>
  </div>

  <div class="progress-label" style="margin: 14px 0 0;">Add and manage the firefighters you can request crew input from</div>

  <div class="question-card">
    <h3>Add a Firefighter</h3>
    <div class="sub-label">Name</div>
    <input type="text" class="text-input" id="new-name" placeholder="e.g. J. Alvarez" style="margin-top:0;">
    <div class="sub-label">Phone (optional, for sending links)</div>
    <input type="text" class="text-input" id="new-phone" placeholder="e.g. (555) 123-4567" style="margin-top:0;">
    <button class="submit-btn" id="add-btn" style="margin-top:16px;">Add to Roster</button>
    <div class="submit-status" id="add-status"></div>
  </div>

  <div class="section-card">
    <h2 class="headline">Current Roster</h2>
    <div id="roster-count" style="color:#a89e91; font-size:13px; margin-bottom:14px;">Loading…</div>
    <div id="roster-list"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="icon">🏠</span>Home</a>
    <a href="trends.html" class="nav-item"><span class="icon">📈</span>Trends</a>
    <a href="admin-roster.html" class="nav-item active"><span class="icon">⚙️</span>Gear</a>
  </nav>

  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://phdvucbtlyqercviknhr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_O5SQke2CeQj2PMMQnsQfHg_YMpe4MVk';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadRoster() {
      const listEl = document.getElementById('roster-list');
      const countEl = document.getElementById('roster-count');
      const { data: rows, error } = await sb.from('firefighters').select('*').order('name');

      if (error) {
        countEl.textContent = 'Could not load the roster right now.';
        return;
      }

      countEl.textContent = `${rows.length} firefighter${rows.length === 1 ? '' : 's'} on the roster`;
      listEl.innerHTML = '';

      if (rows.length === 0) {
        listEl.innerHTML = '<div style="color:#a89e91; text-align:center; padding: 20px 0;">No firefighters added yet.</div>';
        return;
      }

      rows.forEach(person => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #453b32;';
        row.innerHTML = `
          <div>
            <div style="font-weight:700;">${escapeHtml(person.name)}</div>
            ${person.phone ? `<div style="color:#a89e91; font-size:13px;">${escapeHtml(person.phone)}</div>` : ''}
          </div>
          <button class="remove-btn" data-id="${person.id}" style="background:transparent; border:1px solid #7a7167; color:#ff6b6b; border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;">Remove</button>
        `;
        listEl.appendChild(row);
      });

      listEl.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => removeFirefighter(btn.dataset.id));
      });
    }

    async function removeFirefighter(id) {
      if (!confirm('Remove this firefighter from the roster?')) return;
      const { error } = await sb.from('firefighters').delete().eq('id', id);
      if (!error) loadRoster();
    }

    document.getElementById('add-btn').addEventListener('click', async () => {
      const nameEl = document.getElementById('new-name');
      const phoneEl = document.getElementById('new-phone');
      const statusEl = document.getElementById('add-status');
      const name = nameEl.value.trim();
      const phone = phoneEl.value.trim();

      if (!name) {
        statusEl.textContent = 'Please enter a name.';
        statusEl.className = 'submit-status error';
        return;
      }

      const { error } = await sb.from('firefighters').insert([{ name, phone: phone || null }]);

      if (error) {
        statusEl.textContent = 'Something went wrong adding this person. (' + error.message + ')';
        statusEl.className = 'submit-status error';
      } else {
        statusEl.textContent = `${name} added to the roster.`;
        statusEl.className = 'submit-status success';
        nameEl.value = '';
        phoneEl.value = '';
        loadRoster();
      }
    });

    loadRoster();
  </script>

</body>
</html>
